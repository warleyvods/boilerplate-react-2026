# Docker Compose file for local staging environment
# Usage: docker compose -f run.yml up -d
#
# This file sets up the complete environment:
# - Frontend (boilerplate-react-2026) on port 3000
# - Backend (boilerplate-spring-2026) on port 8080
# - PostgreSQL database on port 5432
# - Redis on port 6379

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate -d boilerplate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: boilerplate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (Spring Boot)
  backend:
    image: boilerplate-spring:latest
    container_name: boilerplate-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stage
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/boilerplate
      - SPRING_DATASOURCE_USERNAME=boilerplate
      - SPRING_DATASOURCE_PASSWORD=boilerplate123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    image: boilerplate-react:latest
    container_name: boilerplate-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
